<!DOCTYPE html>
<html>
<head>
    <title>Sound Test</title>
</head>
<body style="background: #333; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
    <h1>WAV Decoder Test</h1>
    <p>Click the buttons below to test each sound.</p>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 600px;">
        <button onclick="play('/sounds/startup.wav')">Play Startup</button>
        <button onclick="play('/sounds/click.wav')">Play Click</button>
        <button onclick="play('/sounds/window-open.wav')">Play Window Open</button>
        <button onclick="play('/sounds/window-close.wav')">Play Window Close</button>
        <button onclick="play('/sounds/error.wav')">Play Error</button>
    </div>
    <div id="status" style="margin-top: 20px; color: #aaa;">Ready.</div>
    <pre id="log" style="background: #000; padding: 10px; width: 80%; overflow: auto; max-height: 200px; text-align: left;"></pre>

    <script>
        function log(msg, color = 'white') {
            const l = document.getElementById('log');
            const span = document.createElement('span');
            span.style.color = color;
            span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            l.appendChild(span);
            console.log(msg);
        }

        async function play(path) {
            const status = document.getElementById('status');
            status.textContent = "Playing: " + path;
            log("Attempting to play: " + path);
            
            try {
                const audio = new Audio(path);
                log("Audio object created. Preloading...");
                
                audio.oncanplaythrough = () => log("✓ Can play through: " + path, 'lime');
                audio.onerror = (e) => log("✗ Error loading: " + path + " (Code: " + (audio.error ? audio.error.code : 'unknown') + ")", 'red');
                
                await audio.play();
                log("▶ Playback started!", 'cyan');
            } catch (err) {
                log("⚠ Playback failed: " + err.message, 'orange');
            }
        }
    </script>
</body>
</html>
